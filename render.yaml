# Render Blueprint for the Sam's Arcade realtime Socket.IO server.
# The Next.js frontend is deployed separately on Vercel.
projects:
  - name: "Sam's Arcade"
    environments:
      - name: Production
        services:
          - type: web
            name: sams-arcade-realtime
            runtime: node
            plan: free
            autoDeploy: true
            buildCommand: npm install --prefix server && npm run build --prefix server
            startCommand: npm start --prefix server
            healthCheckPath: /
            buildFilter:
              paths:
                - server/**
                - prisma/**
            envVars:
              - key: CLIENT_ORIGIN
                value: https://sams-arcade.vercel.app
              - key: DATABASE_URL
                sync: false
              - key: ADMIN_JWT_SECRET
                sync: false
